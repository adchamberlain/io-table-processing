[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iotables"
version = "0.0.1"
description = "Square, Leontief-ready U.S. input-output tables from BEA make and use tables, plus price pass-through models for climate policy."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Andrew Chamberlain" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
iotables = "iotables.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet; downloads to data/raw"]
